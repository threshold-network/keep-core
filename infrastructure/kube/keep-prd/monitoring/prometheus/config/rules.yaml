groups:
  - name: keep-network-join-requests
    rules:
      # Fires only when an abnormal burst of inbound join-request failures
      # coincides with peer loss or coordination degradation on the same
      # node. A high failure ratio alone is expected behavior (unrecognized
      # peers probing the network are rejected by the on-chain firewall
      # check) and intentionally does not fire this alert.
      - alert: KeepNodeJoinFailureBurstWithConnectivityDegradation
        expr: |
          (
              sum by (chain_address) (
                rate(performance_network_join_requests_failed_total{job="keep-discovered-nodes"}[30m])
              )
            >
              4 * sum by (chain_address) (
                rate(performance_network_join_requests_failed_total{job="keep-discovered-nodes"}[6h] offset 30m)
              ) + 0.05
          )
          and on (chain_address)
          (
              min by (chain_address) (
                connected_wellknown_peers_count{job="keep-discovered-nodes"}
              ) == 0
            or
              min by (chain_address) (
                delta(connected_peers_count{job="keep-discovered-nodes"}[30m])
              ) < -5
            or
              sum by (chain_address) (
                increase(performance_coordination_failed_total{job="keep-discovered-nodes"}[1h])
              ) > 0
            or
              sum by (chain_address) (
                increase(performance_coordination_leader_timeout_total{job="keep-discovered-nodes"}[1h])
              ) > 2
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Join-request failure burst with connectivity degradation on
            {{ $labels.chain_address }}
          description: >-
            Inbound network join-request failures on node
            {{ $labels.chain_address }} spiked to more than 4x their 6h
            baseline while the node also shows well-known peer isolation,
            peer loss, or coordination degradation. Check the per-reason
            breakdown (performance_network_join_requests_failed_*_total)
            to tell genuine non-recognition (firewall_unrecognized) apart
            from firewall RPC errors, timeouts, and connection resets.
