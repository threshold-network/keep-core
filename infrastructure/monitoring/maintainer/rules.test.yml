# Run with: promtool test rules rules.test.yml
rule_files: [rules.yml]
evaluation_interval: 1m
tests:
  - name: "healthy service"
    interval: 1m
    input_series:
      - series: "up{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "1+0x120"
      - series: "performance_spv_maintainer_active{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "1+0x120"
      - series: "performance_rpc_eth_healthy{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "1+0x120"
      - series: "performance_rpc_btc_healthy{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "1+0x120"
      - series: "performance_rpc_health_check_interval_seconds{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "60+0x120"
      - series: "performance_rpc_eth_last_check_timestamp_seconds{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "0+60x120"
      - series: "performance_rpc_btc_last_check_timestamp_seconds{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "0+60x120"
      - series: "performance_spv_maintainer_last_activity_timestamp_seconds{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "0+60x120"
      - series: "performance_spv_maintainer_last_success_timestamp_seconds{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "0+60x120"
      - series: "performance_spv_maintainer_last_failure_timestamp_seconds{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "0+0x120"
      - series: "performance_spv_maintainer_max_backoff_seconds{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "1800+0x120"
      - series: "performance_spv_proof_skipped_outside_relay_range_total{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "0+0x120"
      - series: "performance_spv_proof_skipped_exceeded_max_headers_total{job=\"keep-maintainer\", instance=\"maintainer:9601\"}"
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 120m
        alertname: KeepMaintainerDown
        exp_alerts: []
      - eval_time: 120m
        alertname: KeepMaintainerTelemetryMissing
        exp_alerts: []
      - eval_time: 120m
        alertname: KeepMaintainerSPVInactive
        exp_alerts: []
      - eval_time: 120m
