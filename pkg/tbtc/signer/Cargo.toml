[package]
name = "tbtc-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "tBTC Rust signer bootstrap crate for C ABI integration"

[lib]
name = "frost_tbtc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bench-restart-hook = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
frost-secp256k1-tr = "=3.0.0"
# Direct, version-matched access to aggregate_custom + CheaterDetection (the
# frost-secp256k1-tr aggregate wrappers hardcode FirstCheater), plus the
# `internals` feature for compute_lagrange_coefficient (used to validate that
# a submitted public key package's verifying shares are self-consistent -
# see persist_distributed_dkg_key_package). Already a transitive dependency
# via frost-secp256k1-tr, pinned to the same 3.0.0; `internals` only widens
# visibility of existing helpers, it changes no cryptographic behavior.
frost-core = { version = "=3.0.0", default-features = false, features = ["internals"] }
chacha20poly1305 = "0.10"
rand_chacha = "0.3"
libc = "0.2"
zeroize = { version = "1.8", default-features = false, features = ["alloc", "serde"] }
# Pinned exactly to 0.32.8 to prevent silent upstream patch changes; updates require changelog review.
bitcoin = "=0.32.8"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"
proptest = "1.6"
