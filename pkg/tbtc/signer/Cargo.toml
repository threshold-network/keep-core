[package]
name = "tbtc-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "tBTC Rust signer bootstrap crate for C ABI integration"

[lib]
name = "frost_tbtc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bench-restart-hook = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
frost-secp256k1-tr = "=3.0.0"
chacha20poly1305 = "0.10"
rand_chacha = "0.3"
libc = "0.2"
zeroize = { version = "1.8", default-features = false, features = ["serde"] }
bitcoin = "0.32"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"
proptest = "1.6"

[[bench]]
name = "phase5_roast"
harness = false
required-features = ["bench-restart-hook"]
