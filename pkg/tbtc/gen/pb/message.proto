syntax = "proto3";

option go_package = "./pb";
package tbtc;

message SigningDoneMessage {
    uint32 senderID = 1;
    bytes message = 2;
    uint64 attemptNumber = 3;
    bytes signature = 4;
    uint64 endBlock = 5;
}

message CoordinationProposal {
    uint32 actionType = 1;
    bytes payload = 2;
}

message CoordinationMessage {
    uint32 senderID = 1;
    uint64 coordinationBlock = 2;
    bytes walletPublicKeyHash = 3;
    CoordinationProposal proposal = 4;
}

message HeartbeatProposal {
    bytes message = 1;
}

message DepositSweepProposal {
    message DepositKey {
        bytes fundingTxHash = 1;
        uint32 fundingOutputIndex = 2;
    }

    repeated DepositKey depositsKeys = 1;
    bytes sweepTxFee = 2;
    repeated uint64 depositsRevealBlocks = 3;
}

message RedemptionProposal {
    repeated bytes redeemersOutputScripts = 1;
    bytes redemptionTxFee = 2;
}

message MovingFundsProposal {
    repeated bytes targetWallets = 1;
    bytes movingFundsTxFee = 2;
}

message MovedFundsSweepProposal {
    bytes movingFundsTxHash = 1;
    uint32 movingFundsTxOutputIndex = 2;
    bytes sweepTxFee = 3;
}

message ReservationAnchorProposal {
    bytes depositFundingTxHash = 1;
    uint32 depositFundingOutputIndex = 2;
    uint64 requestNonce = 3;
    bytes anchorTxFee = 4;
}

message ReservationReanchorProposal {
    bytes reservationKey = 1;
    uint64 requestNonce = 2;
    bytes targetWalletPublicKeyHash = 3;
    bytes reanchorTxFee = 4;
}
