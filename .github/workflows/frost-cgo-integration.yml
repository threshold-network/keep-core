name: FROST cgo integration

# Pre-merge validation gate for the interactive FROST cgo path (RFC-21 Phase 7.3).
#
# The rest of CI builds NONE of the `frost_native frost_tbtc_signer cgo` tags, so the
# real-crypto interactive tests (which link libfrost_tbtc, built from the Rust signer
# crate) are otherwise validated only locally and can silently rot. This job builds the
# lib from a PINNED signer source (ci/frost-signer-pin.env) and runs the cgo-tagged tests
# against it with skips FORBIDDEN (KEEP_CORE_FROST_REQUIRE_CGO=true), so a stale/missing/
# unloadable lib fails the job instead of quietly dropping coverage.
#
# The tag set also includes `frost_roast_retry`, so the ROAST retry coordinator flow is
# compiled and tested against real crypto here (the mock-FFI variant runs in client.yml),
# and the job smoke-builds the full activation artifact via `make build-frost`. The
# non-cgo tagged build/test coverage lives in the client.yml `client-frost-roast-retry`
# job. This job is the ONLY one that supplies `frost_tbtc_signer` and `cgo`, so every
# package holding files guarded by that combination must be named in its test
# invocation below -- currently pkg/frost/signing and pkg/tbtc. A file guarded by
# those tags in an unlisted package compiles in no CI job whatsoever.
#
# The Go interactive code and the signer crate currently live on separate branches, so
# this checks the pinned mirror commit out into a side path and builds from there. After
# the branches merge, replace the cross-branch checkout with an in-tree cargo build and
# keep the gate.

on:
  pull_request:
    paths:
      - "pkg/frost/**"
      - "pkg/tbtc/**"
      - "pkg/net/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "ci/frost-signer-pin.env"
      - ".github/workflows/frost-cgo-integration.yml"
  workflow_dispatch: {}

jobs:
  frost-cgo-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Go branch
        uses: actions/checkout@v4

      - name: Read the pinned signer source ref
        id: pin
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ci/frost-signer-pin.env
          if [ -z "${FROST_SIGNER_MIRROR_REF:-}" ]; then
            echo "FROST_SIGNER_MIRROR_REF is not set in ci/frost-signer-pin.env"
            exit 1
          fi
          echo "ref=${FROST_SIGNER_MIRROR_REF}" >> "$GITHUB_OUTPUT"
          echo "Pinned tbtc-signer source: ${FROST_SIGNER_MIRROR_REF}"

      - name: Check out the pinned signer source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.ref }}
          path: _signer-mirror

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build libfrost_tbtc from the pinned source
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/_frost-target
        run: |
          set -euo pipefail
          test -f _signer-mirror/pkg/tbtc/signer/Cargo.toml || {
            echo "signer crate not found at the pinned ref (_signer-mirror/pkg/tbtc/signer)"; exit 1; }
          cargo build --manifest-path _signer-mirror/pkg/tbtc/signer/Cargo.toml
          lib="${CARGO_TARGET_DIR}/debug/libfrost_tbtc.so"
          test -f "$lib" || { echo "libfrost_tbtc.so not found at $lib"; exit 1; }
          echo "FROST_LIB_DIR=${CARGO_TARGET_DIR}/debug" >> "$GITHUB_ENV"

      - name: Verify the witness geometry reservations agree across languages
        run: |
          set -euo pipefail
          # The Go validators mint and pre-verify the offline-authority-signed trust
          # certificates, so a geometry Go accepts must be exactly a geometry the signer
          # accepts. Go cannot see the crate (it lives on the mirror branch), so its own
          # test can only pin its own constants - it cannot notice the signer moving.
          # This job can: it has the pinned crate checked out, so it compares the two
          # sources directly. A reservation raised in Rust fails HERE, in the same gate
          # that builds the pinned library, instead of surfacing after an operator has
          # already run the offline signing ceremony against a geometry the node rejects.
          rust_const() {
            grep -oE "pub\(crate\) const $1: usize = [0-9]+" \
              _signer-mirror/pkg/tbtc/signer/src/engine/store.rs \
              | grep -oE '[0-9]+$'
          }
          go_const() {
            grep -oE "$1 uint64 = [0-9]+" \
              pkg/frost/signing/native_tbtc_signer_state_anchor_trust.go \
              | grep -oE '[0-9]+$'
          }
          mismatch=0
          check() {
            rust_value="$(rust_const "$1" || true)"
            go_value="$(go_const "$2" || true)"
            if [ -z "$rust_value" ] || [ -z "$go_value" ]; then
              echo "could not read $1 (rust) / $2 (go); a constant was renamed"
              mismatch=1
              return
            fi
            if [ "$rust_value" != "$go_value" ]; then
              echo "witness geometry drift: $1 is [$rust_value] but $2 is [$go_value]"
              mismatch=1
            fi
          }
          check TBTC_SIGNER_STATE_WITNESS_ROTATION_TERMINAL_RECORD_RESERVATION \
            NativeTBTCSignerStateWitnessRotationTerminalRecordReservation
          check TBTC_SIGNER_STATE_WITNESS_QUARANTINE_RECORD_RESERVATION \
            NativeTBTCSignerStateWitnessQuarantineRecordReservation
          test "$mismatch" -eq 0 || {
            echo "update the Go reservation constants and their validator in the same change"
            exit 1; }

      - name: Verify the engine ABI symbols are exported
        run: |
          set -euo pipefail
          lib="${FROST_LIB_DIR}/libfrost_tbtc.so"
          # A representative slice of the symbols the cgo bridge resolves via
          # dlsym(RTLD_DEFAULT). A miss here means the pinned lib is stale vs. the bridge;
          # fail with a clear message (the require-cgo run below would also catch it).
          missing=0
          for sym in \
            frost_tbtc_persist_distributed_dkg_key_package \
            frost_tbtc_retire_distributed_dkg_key_packages \
            frost_tbtc_dkg_part1 \
            frost_tbtc_derive_interactive_attempt_context \
            frost_tbtc_interactive_session_open \
            frost_tbtc_interactive_session_abort \
            frost_tbtc_new_signing_package \
            frost_tbtc_interactive_aggregate \
            frost_tbtc_verify_signature_share \
            frost_tbtc_durable_store_identity \
            frost_tbtc_retained_key_package_inventory \
            frost_tbtc_state_witness_proof \
            frost_tbtc_state_witness_tip \
            frost_tbtc_state_anchor_trust_head \
            frost_tbtc_transition_state_witness_anchor \
            frost_tbtc_state_anchor_bootstrap_facts \
            frost_tbtc_acknowledge_state_witness_checkpoint \
            frost_tbtc_recover_state_witness_checkpoint \
            frost_tbtc_begin_share_repair_session \
            frost_tbtc_finish_share_repair_session \
            frost_tbtc_share_repair_part1 \
            frost_tbtc_share_repair_part2 \
            frost_tbtc_install_repaired_share \
            frost_tbtc_version \
            frost_tbtc_abi_version; do
            if ! nm -D --defined-only "$lib" | grep -q " ${sym}$"; then
              echo "missing exported symbol: ${sym}"
              missing=1
            fi
          done
          test "$missing" -eq 0 || { echo "pinned libfrost_tbtc is missing required symbols"; exit 1; }

      - name: Run the cgo-tagged real-crypto tests (skips forbidden)
        env:
          CGO_ENABLED: "1"
          KEEP_CORE_FROST_REQUIRE_CGO: "true"
          # Single source of truth for the packages this gate compiles. The guard below
          # fails the job if a package needing these tags is missing from the list.
          CGO_TAGGED_PACKAGES: "./pkg/frost/signing/ ./pkg/tbtc/"
          CGO_TAGGED_TAGS: "frost_native frost_tbtc_signer frost_roast_retry"
        run: |
          set -euo pipefail
          # This job is the only one that supplies `frost_tbtc_signer` and `cgo`, so a
          # file guarded by them in an unlisted package compiles in NO ci job. That is
          # how the pkg/tbtc startup backend guard (TestVerifyFrostSigningBackend) came
          # to be compiled by nothing while CI still reported full coverage.
          #
          # Ask the toolchain rather than grepping build tags: list every package twice,
          # once without `frost_tbtc_signer` and once with it, and compare file counts.
          # A package whose count changes has files gated behind the tag and must appear
          # in CGO_TAGGED_PACKAGES.
          listFormat='{{.ImportPath}} {{len .GoFiles}}+{{len .TestGoFiles}}+{{len .XTestGoFiles}}'
          missingPackages=0
          while read -r pkg; do
            case " ${CGO_TAGGED_PACKAGES} " in
              *" ./${pkg}/ "*) ;;
              *)
                echo "::error::${pkg} has ${CGO_TAGGED_TAGS}-gated files but is not in CGO_TAGGED_PACKAGES"
                missingPackages=1
                ;;
            esac
          done < <(
            join -j1 \
              <(go list -tags "frost_native frost_roast_retry" -f "$listFormat" ./pkg/... | sort) \
              <(go list -tags "${CGO_TAGGED_TAGS}" -f "$listFormat" ./pkg/... | sort) \
              | awk '$2 != $3 {print $1}' \
              | sed 's#^github.com/keep-network/keep-core/##'
          )
          test "$missingPackages" -eq 0 || {
            echo "cgo tag coverage gap: the packages above would compile in no CI job"; exit 1; }

          # --no-as-needed keeps the DT_NEEDED on libfrost_tbtc even though the bridge
          # references its symbols only via dlsym (no direct references), so the loader
          # makes them resolvable at runtime; rpath lets the test binary find the .so.
          export CGO_LDFLAGS="-L${FROST_LIB_DIR} -Wl,--no-as-needed -lfrost_tbtc -Wl,-rpath,${FROST_LIB_DIR}"
          # Run the WHOLE tagged suite against the linked lib, not a narrow -run subset.
          # `frost_roast_retry` is in the tag set so the ROAST retry coordinator flow
          # (liveness + evidence/blame) is compiled and tested against real crypto here
          # too, not only in the mock-FFI job (client.yml). With
          # KEEP_CORE_FROST_REQUIRE_CGO=true a lib-unavailable would-be skip becomes a
          # hard failure, so a stale or missing symbol fails the gate instead of
          # silently dropping coverage.
          # shellcheck disable=SC2086 # word splitting is intended for the package list
          go test -tags "${CGO_TAGGED_TAGS}" -count=1 \
            -timeout 20m \
            ${CGO_TAGGED_PACKAGES}

      - name: Smoke-build the FROST activation artifact (make build-frost)
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # Proves the release/activation binary - the keep-client built with
          # `frost_native frost_tbtc_signer frost_roast_retry` and linked against
          # libfrost_tbtc - actually compiles and links. The default `make build` the
          # release/Docker path runs ships the `!frost_roast_retry` no-op stubs; this is
          # the target that produces the ROAST-retry-enabled artifact once the readiness
          # manifest flips. Reuses the same lib built above (frost_lib_dir=FROST_LIB_DIR).
          make build-frost frost_lib_dir="${FROST_LIB_DIR}"
          test -x ./keep-client || { echo "keep-client activation binary was not produced"; exit 1; }
          ./keep-client --version
