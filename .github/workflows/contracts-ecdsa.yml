name: Solidity ECDSA

on:
  pull_request:
    branches:
      - main
      - dev
  # We intend to use `workflow dispatch` in two different situations/paths
  # 1. If a workflow will be manually dispatched from branch named
  #    `dapp-development`, workflow will deploy the contracts on the selected
  #    testnet and publish them to NPM registry with `dapp-dev-<environment>`
  #    suffix and `dapp-development-<environment>` tag. Such packages are meant
  #    to be used locally by the team developing Threshold Token dApp and may
  #    contain contracts that have different values from the ones used on
  #    mainnet.
  # 2. If a workflow will be manually dispatched from a branch which name is not
  #    `dapp-development`, the workflow will deploy the contracts on the
  #    selected testnet and publish them to NPM registry with `<environment>`
  #    suffix and tag. Such packages will be used later to deploy public
  #    Threshold Token dApp on a testnet, with contracts resembling those used
  #    on mainnet.
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (network) for workflow execution, e.g. `sepolia`"
        required: true
      upstream_builds:
        description: "Upstream builds"
        required: false
      upstream_ref:
        description: "Git reference to checkout (e.g. branch name)"
        required: false
        default: "main"

jobs:
  contracts-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v3
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './solidity/ecdsa/**'
              - './.github/workflows/contracts-ecdsa.yml'
              - './.github/actions/install-yarn-deps/**'
              - './.github/actions/docker-build-push/**'

  contracts-lint:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/ecdsa
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

  contracts-slither:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/ecdsa
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: actions/setup-python@v4
        with:
          python-version: 3.10.8

      - name: Install Solidity
        env:
          SOLC_VERSION: 0.8.9 # according to solidity.version in hardhat.config.ts
        run: |
          pip3 install solc-select
          solc-select install $SOLC_VERSION
          solc-select use $SOLC_VERSION

      - name: Install Slither
        env:
          SLITHER_VERSION: 0.8.3
        run: pip3 install slither-analyzer==$SLITHER_VERSION

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      # As a workaround for a slither issue https://github.com/crytic/slither/issues/1140
      # we disable compilation of dependencies when running slither.
      - name: Run Slither
        run: SKIP_DEPENDENCY_COMPILER=true slither . --compile-force-framework hardhat

  contracts-build-and-test:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/ecdsa
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      - name: Build solidity contracts
        run: yarn build

      - name: Run tests
        if: github.ref != 'refs/heads/dapp-development'
        run: yarn test

  contracts-deployment-dry-run:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/ecdsa
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      - name: Deploy contracts
        run: yarn deploy:test

      - name: Build Docker Image
        uses: ./.github/actions/docker-build-push
        with:
          imageName: keep-ecdsa-hardhat
          push: false
          load: true
          context: ./solidity/ecdsa

      - name: Verify non-root runtime user
        run: |
          docker run --rm --entrypoint sh "$IMAGE_NAME" -c 'test "$(id -u)" = 1000 && test "$(id -g)" = 1000'
          docker run --rm --entrypoint sh "$IMAGE_NAME" -c 'test -w "$WORK_DIR"'
          docker run --rm "$IMAGE_NAME" --help >/dev/null

  # Verifies that hardhat-deploy's `export`/`export.json` output - the
  # artifact shape consumed downstream by @keep-network/tbtc-v2 - stays
  # byte-identical to the committed baseline. This is the automated gate
  # for the core safety constraint of issue #4216 (the hardhat-deploy v1
  # upgrade): without it, drift in the deploy/export artifact shape would
  # only ever be caught by a one-off manual comparison, not by CI. A
  # mismatch means the deploy/export artifact shape changed; if that is
  # intentional, regenerate the baseline locally and commit
  # solidity/ecdsa/export-baseline.sha256 alongside the change.
  #
  # The manifest includes the frozen legacy contracts and remaining external
  # artifacts. Vendored sources/artifacts are committed; yarn.lock pins the
  # installed dependencies. Regenerate this baseline when either changes.
  contracts-export-byte-identity:
    needs: contracts-detect-changes
    if: github.event_name != 'pull_request' || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/ecdsa
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      - name: Deploy contracts and generate export artifacts
        run: |
          yarn deploy:test --network hardhat --export export.json
          yarn prepack

      - name: Verify export byte-identity against baseline
        run: |
          set -e
          sha256sum export.json > /tmp/manifest.txt
          # Sort paths consistently across developer machines and CI locales.
          find export -type f | LC_ALL=C sort | xargs sha256sum >> /tmp/manifest.txt
          if ! diff -q export-baseline.sha256 /tmp/manifest.txt > /dev/null; then
            echo "::error::export.json / export/ artifacts differ from the committed baseline (solidity/ecdsa/export-baseline.sha256)."
            echo "::error::If this change is intentional, regenerate the baseline locally (yarn deploy:test --network hardhat --export export.json && yarn prepack, then sha256sum export.json > export-baseline.sha256 && find export -type f | LC_ALL=C sort | xargs sha256sum >> export-baseline.sha256) and commit solidity/ecdsa/export-baseline.sha256 alongside it."
            diff export-baseline.sha256 /tmp/manifest.txt || true
            exit 1
          fi
          echo "export byte-identity OK"

  # Verifies that the committed artifact JSONs in solidity/ecdsa/external/random-beacon-export/artifacts/
  # match the recorded SHA256 hashes in VENDOR.json. This closes the gap left by artifactSha256 which
  # records the pristine pre-stripping upstream hash (by design) and cannot verify the committed files.
  contracts-random-beacon-export-artifacts-byte-identity:
    needs: contracts-detect-changes
    if: github.event_name != 'pull_request' || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Verify random beacon export artifact byte-identity
        run: |
          set -e
          MISMATCH=0
          while IFS= read -r line; do
            KEY=$(echo "$line" | cut -d':' -f1)
            EXPECTED=$(echo "$line" | cut -d':' -f2)
            ACTUAL=$(sha256sum "solidity/ecdsa/external/random-beacon-export/artifacts/$KEY" 2>/dev/null | cut -d' ' -f1)
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Artifact $KEY mismatch: expected $EXPECTED, got $ACTUAL"
              MISMATCH=1
            fi
          done < <(jq -r '.committedSha256 | to_entries | .[] | "\(.key):\(.value)"' solidity/ecdsa/external/random-beacon-export/VENDOR.json)
          if [ $MISMATCH -ne 0 ]; then
            exit 1
          fi
          echo 'committed artifact byte-identity OK'
  contracts-deployment-testnet:
    needs: [contracts-build-and-test]
    if: |
      github.event_name == 'workflow_dispatch'
        && github.ref != 'refs/heads/dapp-development'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/ecdsa
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"
          registry-url: "https://registry.npmjs.org"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      - name: Get upstream packages versions
        uses: keep-network/ci/actions/upstream-builds-query@v2
        id: upstream-builds-query
        with:
          upstream-builds: ${{ github.event.inputs.upstream_builds }}
          query: |
            threshold-contracts-version = github.com/threshold-network/solidity-contracts#version

      - name: Resolve latest contracts
        run: |
          yarn up \
            @threshold-network/solidity-contracts@${{ steps.upstream-builds-query.outputs.threshold-contracts-version }}

      - name: Configure tenderly
        env:
          TENDERLY_TOKEN: ${{ secrets.TENDERLY_TOKEN }}
        run: ./config_tenderly.sh

      - name: Deploy contracts
        env:
          CHAIN_API_URL: ${{ secrets.SEPOLIA_ETH_HOSTNAME_HTTP }}
          ACCOUNTS_PRIVATE_KEYS: ${{ secrets.TESTNET_ETH_CONTRACT_OWNER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: yarn deploy --network ${{ github.event.inputs.environment }}

      - name: Bump up package version
        id: npm-version-bump
        uses: keep-network/npm-version-bump@v2
        with:
          work-dir: solidity/ecdsa
          environment: ${{ github.event.inputs.environment }}
          branch: ${{ github.ref }}
          commit: ${{ github.sha }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag ${{ github.event.inputs.environment }} --network=${{ github.event.inputs.environment }}

      - name: Build and Publish Docker image
        uses: ./.github/actions/docker-build-push
        with:
          environment: ${{ github.event.inputs.environment }}
          imageName: keep-ecdsa-hardhat
          context: ./solidity/ecdsa
          push: true
          gcrJsonKey: ${{ secrets.KEEP_TEST_GCR_JSON_KEY }}

      - name: Notify CI about completion of the workflow
        uses: keep-network/ci/actions/notify-workflow-completed@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          module: "github.com/keep-network/keep-core/ecdsa"
          url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: ${{ github.event.inputs.environment }}
          upstream_builds: ${{ github.event.inputs.upstream_builds }}
          upstream_ref: ${{ github.event.inputs.upstream_ref }}
          version: ${{ steps.npm-version-bump.outputs.version }}

  # This job is responsible for publishing packackes with slightly modified
  # contracts. The modifications are there to help with the process of testing
  # some features on the T Token Dashboard. The job starts only if workflow
  # gets triggered by the `workflow_dispatch` event on the branch called
  # `dapp-development`.
  contracts-dapp-development-deployment-testnet:
    needs: [contracts-build-and-test]
    if: |
      github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/dapp-development'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/ecdsa
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"
          registry-url: "https://registry.npmjs.org"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      - name: Get upstream packages versions
        uses: keep-network/ci/actions/upstream-builds-query@v2
        id: upstream-builds-query
        with:
          upstream-builds: ${{ github.event.inputs.upstream_builds }}
          query: |
            threshold-contracts-version = github.com/threshold-network/solidity-contracts#version

      - name: Resolve latest contracts
        run: |
          yarn up \
            @threshold-network/solidity-contracts@${{ steps.upstream-builds-query.outputs.threshold-contracts-version }}
      
      - name: Deploy contracts
        env:
          CHAIN_API_URL: ${{ secrets.SEPOLIA_ETH_HOSTNAME_HTTP }}
          ACCOUNTS_PRIVATE_KEYS: ${{ secrets.DAPP_DEV_TESTNET_ETH_CONTRACT_OWNER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: yarn deploy --network ${{ github.event.inputs.environment }}

      - name: Bump up package version
        id: npm-version-bump
        uses: keep-network/npm-version-bump@v2
        with:
          work-dir: solidity/ecdsa
          environment: dapp-dev-${{ github.event.inputs.environment }}
          branch: ${{ github.ref }}
          commit: ${{ github.sha }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag dapp-development-${{ github.event.inputs.environment }} --network=${{ github.event.inputs.environment }}

      - name: Build and Publish Docker image
        uses: ./.github/actions/docker-build-push
        with:
          environment: ${{ github.event.inputs.environment }}
          imageName: keep-ecdsa-hardhat-dapp-dev
          context: ./solidity/ecdsa
          push: true
          gcrJsonKey: ${{ secrets.KEEP_TEST_GCR_JSON_KEY }}

      - name: Notify CI about completion of the workflow
        uses: keep-network/ci/actions/notify-workflow-completed@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          module: "github.com/keep-network/keep-core/ecdsa"
          url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: ${{ github.event.inputs.environment }}
          upstream_builds: ${{ github.event.inputs.upstream_builds }}
          upstream_ref: dapp-development
          version: ${{ steps.npm-version-bump.outputs.version }}
