name: Client

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "infrastructure/**"
      - "scripts/**"
      - "solidity/**"
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for workflow execution"
        required: false
        default: "dev"
      upstream_builds:
        description: "Upstream builds"
        required: false
      upstream_ref:
        description: "Git reference to checkout (e.g. branch name)"
        required: false
        default: "main"

# Automatic releases are now handled by the dedicated release.yml workflow

jobs:
  client-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './!((docs|infrastructure|scripts|solidity)/**)'

  electrum-integration-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './config/_electrum_urls/**'
              - './pkg/bitcoin/electrum/**'
  btcec-vendor-byte-identity:
    # Enforces the VENDOR.md byte-identity recipe and runs the
    # vendored upstream test suite. The root module's `go test ./...`
    # cannot reach third_party/btcsuite/btcec (it is its own Go
    # module), so this job is the only automated gate. Cheap (checkout
    # + go install + two short steps) and runs on every event, every
    # branch - gating by path was producing broken `if:` combinations
    # with no upside.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Verify vendored btcec byte identity vs upstream v0.22.3
        run: |
          set -e
          go mod download github.com/btcsuite/btcd@v0.22.3
          upstream="$(go env GOMODCACHE)/github.com/btcsuite/btcd@v0.22.3/btcec"
          rm -rf /tmp/btcec-upstream
          cp -R "$upstream" /tmp/btcec-upstream
          chmod -R u+w /tmp/btcec-upstream
          gofmt -w /tmp/btcec-upstream

          # Hash manifest comparison: every file in the upstream tree
          # (minus the four vendoring-only files) must match the
          # vendored copy byte-for-byte, and the file set must match
          # exactly. Two small text streams reach `diff`, so this is
          # tool-independent (BusyBox and GNU diff both handle it)
          # and a non-zero exit is the gate directly.
          manifest() {
            ( cd "$1" && find . -type f \
                ! -name go.mod ! -name go.sum ! -name LICENSE ! -name VENDOR.md \
                -print0 | sort -z | xargs -0 sha256sum )
          }
          manifest /tmp/btcec-upstream | sort > /tmp/up.txt
          manifest third_party/btcsuite/btcec | sort > /tmp/vend.txt
          if ! diff -q /tmp/up.txt /tmp/vend.txt > /dev/null; then
            echo '::error::Vendored btcec differs from upstream v0.22.3 beyond the four vendoring-only files:'
            diff /tmp/up.txt /tmp/vend.txt | head -40
            exit 1
          fi
          echo 'byte-identity OK'

      - name: Run vendored btcec test suite
        run: |
          cd third_party/btcsuite/btcec && go test ./...

  client-build-test-publish:
    needs: client-detect-changes
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole history for the `git describe` command to work.
          fetch-depth: 0

      - name: Resolve versions
        run: |
          echo "version=$(git describe --tags --match "v[0-9]*" HEAD)" >> $GITHUB_ENV
          echo "revision=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Load environment variables
        uses: keep-network/ci/actions/load-env-variables@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          environment: ${{ github.event.inputs.environment }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Build Image
        uses: docker/build-push-action@v5
        with:
          target: build-docker
          tags: go-build-env
          build-args: |
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          load: true # load image to local registry to use it in next steps
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          context: .

      # Since build-push-action doesn't support outputing an image to multiple outputs
      # we need to save it in a separate step. See: https://github.com/moby/buildkit/issues/1555
      # Once multiple outputs are supported we can replace this step with
      # `outputs` property configured in `Build Docker Build Image`:
      #   outputs: |
      #      type=image
      #      type=docker,dest=/tmp/go-build-env-image.tar
      - name: Save Docker Build Image
        run: |
          docker save --output /tmp/go-build-env-image.tar go-build-env

      - name: Upload Docker Build Image
        uses: actions/upload-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp/go-build-env-image.tar

      - name: Run Go tests
        run: |
          mkdir -p ${{ github.workspace }}/coverage
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            -v ${{ github.workspace }}/coverage:/coverage \
            go-build-env \
            gotestsum -- -timeout 15m -coverprofile=/coverage/coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage/coverage.out
          if-no-files-found: warn

      - name: Check coverage gate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/coverage:/coverage" \
            go-build-env \
            go tool cover -func /coverage/coverage.out > /tmp/cover-func.txt
          TOTAL=$(grep '^total:' /tmp/cover-func.txt | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          PASS=$(awk -v t="$TOTAL" 'BEGIN { print (t+0 >= 14) ? "yes" : "no" }')
          if [ "$PASS" != "yes" ]; then
            echo "::error::Coverage ${TOTAL}% is below the 14% minimum threshold"
            exit 1
          fi

      - name: Build Docker Runtime Image
        if: github.event_name != 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          target: runtime-docker
          labels: |
            version=${{ env.version }}
            revision=${{ env.revision }}
          push: false
          context: .

      - name: Login to Google Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCR_REGISTRY_URL }}
          username: _json_key
          password: ${{ secrets.KEEP_TEST_GCR_JSON_KEY }}

      - name: Build and publish Docker Runtime Image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        env:
          IMAGE_NAME: "keep-client"
        with:
          target: runtime-docker
          tags: |
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.version }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.environment }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.version }}-${{ github.event.inputs.environment }}
          labels: |
            version=${{ env.version }}
            revision=${{ env.revision }}
          build-args: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          push: true
          context: .

      - name: Build Client Binaries
        uses: docker/build-push-action@v5
        with:
          target: output-bins
          outputs: type=local,dest=./out/bin/
          build-args: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          push: false
          context: .

      - name: Archive Client Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            out/bin/*.tar.gz
            out/bin/*.md5
            out/bin/*.sha256

      - name: Publish Client Binaries
        if: github.event_name == 'workflow_dispatch'
        uses: thesis/gcp-storage-bucket-action@v3.1.0
        with:
          service-key: ${{ secrets.KEEP_TEST_CLIENT_BINARIES_UPLOADER_SERVICE_KEY_JSON_BASE64 }}
          # TODO: Change to keep-prd-210b once mainnet setup is done and we are sure we want to publish mainnet builds automatically.
          project: keep-test-f3e0
          bucket-name: keep-test-client-binaries
          bucket-path: ${{ github.event.inputs.environment }}/${{ env.version }}
          build-folder: out/bin

      - name: Notify CI about completion of the workflow
        if: github.event_name == 'workflow_dispatch'
        uses: keep-network/ci/actions/notify-workflow-completed@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          module: "github.com/keep-network/keep-core/client"
          url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: ${{ github.event.inputs.environment }}
          upstream_builds: ${{ github.event.inputs.upstream_builds }}
          upstream_ref: ${{ github.event.inputs.upstream_ref }}
          version: ${{ env.version }}

      - # Temp fix - move cache instead of copying (added below step and
        # modified value of `cache-to`).
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        # Without the change some jobs were failing with `no space left on device`
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  client-scan:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          args: |
            -exclude=G115,G118
            -exclude-dir=pkg/chain/ethereum/beacon/gen
            -exclude-dir=pkg/chain/ethereum/ecdsa/gen
            -exclude-dir=pkg/chain/ethereum/threshold/gen
            -exclude-dir=pkg/chain/ethereum/tbtc/gen
            ./...

  client-format:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: gofmt
        run: |
          if [ $(gofmt -l . | wc -l) -gt 0 ]; then
            gofmt -d -e .
            exit 1
          fi

  client-vet:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go vet

  client-lint:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.0
        with:
          version: "2025.1.1"
          install-go: false
          checks: "-SA1019"

  client-bench:
    needs: [client-build-test-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      - name: Download previous benchmark results
        id: download-prev
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: go-bench
          path: bench-prev
          workflow: client.yml
          branch: main
          if_no_artifact_found: warn

      - name: Run benchmarks
        run: |
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            go test -bench=. -benchmem -count=10 -run='^$' ./pkg/... \
            > bench.txt
          cat bench.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare benchmarks
        if: steps.download-prev.outcome == 'success' && hashFiles('bench-prev/**') != ''
        run: |
          benchstat bench-prev/*.txt bench.txt | tee benchstat-results.txt
          python3 - <<'EOF'
          import sys, re
          content = open('benchstat-results.txt').read()
          regressions = []
          for line in content.splitlines():
              if '~' in line or not line.strip():
                  continue
              m = re.search(r'\+(\d+\.\d+)%', line)
              if m and float(m.group(1)) > 20:
                  regressions.append(line)
          if regressions:
              print('Performance regressions >20% detected:')
              for r in regressions:
                  print(' ', r)
              sys.exit(1)
          EOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-bench
          path: bench.txt
          overwrite: true
          if-no-files-found: warn

  client-integration-test:
    needs: [client-detect-changes, electrum-integration-detect-changes, client-build-test-publish]
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      - name: Run Go Integration Tests
        run: |
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            gotestsum -- -timeout 20m -tags=integration ./...
