name: Client

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "infrastructure/**"
      - "scripts/**"
      - "solidity/**"
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for workflow execution"
        required: false
        default: "dev"
      upstream_builds:
        description: "Upstream builds"
        required: false
      upstream_ref:
        description: "Git reference to checkout (e.g. branch name)"
        required: false
        default: "main"

# Automatic releases are now handled by the dedicated release.yml workflow

# One concurrency group per PR: re-pushing a PR cancels the superseded
# run (only the newest commit's run gates the PR). push / schedule /
# workflow_dispatch runs get their own group per run id with cancellation
# disabled, so main/dev pushes and the nightly schedule are never
# cancelled by a concurrent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './!((docs|infrastructure|scripts|solidity)/**)'

  electrum-integration-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './config/_electrum_urls/**'
              - './config/electrum*.go'
              - './pkg/bitcoin/**'
              - './internal/testdata/bitcoin/**'
              - './go.mod'
              - './go.sum'
              - './third_party/**'
              - './.github/workflows/client.yml'
# btcec-vendor-byte-identity runs on every event, every branch - gating by path was
# producing broken `if:` combinations with no upside.
  btcec-vendor-byte-identity:
    # Enforces the VENDOR.md byte-identity recipe and runs the
    # vendored upstream test suite. The root module's `go test ./...`
    # cannot reach third_party/btcsuite/btcec (it is its own Go
    # module), so this job is the only automated gate. Cheap (checkout
    # + go install + two short steps) and runs on every event, every
    # branch - gating by path was producing broken `if:` combinations
    # with no upside.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Verify vendored btcec byte identity vs upstream v0.22.3
        run: |
          set -e
          go mod download github.com/btcsuite/btcd@v0.22.3
          upstream="$(go env GOMODCACHE)/github.com/btcsuite/btcd@v0.22.3/btcec"
          rm -rf /tmp/btcec-upstream
          cp -R "$upstream" /tmp/btcec-upstream
          chmod -R u+w /tmp/btcec-upstream
          gofmt -w /tmp/btcec-upstream

          # Hash manifest comparison: every file in the upstream tree
          # (minus the four vendoring-only files) must match the
          # vendored copy byte-for-byte, and the file set must match
          # exactly. Two small text streams reach `diff`, so this is
          # tool-independent (BusyBox and GNU diff both handle it)
          # and a non-zero exit is the gate directly.
          manifest() {
            ( cd "$1" && find . -type f \
                ! -name go.mod ! -name go.sum ! -name LICENSE ! -name VENDOR.md \
                -print0 | sort -z | xargs -0 sha256sum )
          }
          manifest /tmp/btcec-upstream | sort > /tmp/up.txt
          manifest third_party/btcsuite/btcec | sort > /tmp/vend.txt
          if ! diff -q /tmp/up.txt /tmp/vend.txt > /dev/null; then
            echo '::error::Vendored btcec differs from upstream v0.22.3 beyond the four vendoring-only files:'
            diff /tmp/up.txt /tmp/vend.txt | head -40
            exit 1
          fi
          echo 'byte-identity OK'

      - name: Run vendored btcec test suite
        run: |
          cd third_party/btcsuite/btcec && go test ./...

  electrum-vendor-byte-identity:
    # Enforces the VENDOR.md byte-identity recipe for go-electrum and
    # runs the vendored upstream test suite. Mirrors the btcec-vendor-byte-identity
    # job pattern: runs on every event, every branch without path gating.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Verify vendored go-electrum byte identity vs upstream v0.0.0-20240206170935-6038cb594daa
        run: |
          set -e
          go mod download github.com/keep-network/go-electrum@v0.0.0-20240206170935-6038cb594daa
          upstream="$(go env GOMODCACHE)/github.com/keep-network/go-electrum@v0.0.0-20240206170935-6038cb594daa/electrum"
          rm -rf /tmp/electrum-upstream
          cp -R "$upstream" /tmp/electrum-upstream
          chmod -R u+w /tmp/electrum-upstream
          gofmt -w /tmp/electrum-upstream

          # Hash manifest comparison: every file in the upstream tree
          # (minus vendoring-only files and locally patched files) must match
          # the vendored copy byte-for-byte, and the file set must match exactly.
          manifest() {
            ( cd "$1" && find . -type f \
                ! -name go.mod ! -name go.sum ! -name LICENSE ! -name VENDOR.md \
                ! -name network.go ! -name transport.go ! -name transport_ws.go \
                ! -name scripthash.go \
                ! -name cancellation_test.go ! -name network_test.go \
                -print0 | sort -z | xargs -0 sha256sum )
          }
          manifest /tmp/electrum-upstream | sort > /tmp/up.txt
          manifest third_party/go-electrum/electrum | sort > /tmp/vend.txt
          if ! diff -q /tmp/up.txt /tmp/vend.txt > /dev/null; then
            echo '::error::Vendored go-electrum differs from upstream v0.0.0-20240206170935-6038cb594daa beyond the allowed local patches:'
            diff /tmp/up.txt /tmp/vend.txt | head -40
            exit 1
          fi

          # Verify file sets match (no extra or missing files outside exclusions)
          filelist() {
            ( cd "$1" && find . -type f \
                ! -name go.mod ! -name go.sum ! -name LICENSE ! -name VENDOR.md \
                ! -name network.go ! -name transport.go ! -name transport_ws.go \
                ! -name scripthash.go \
                ! -name cancellation_test.go ! -name network_test.go \
                -printf '%P\n' | sort )
          }
          filelist /tmp/electrum-upstream > /tmp/up_files.txt
          filelist third_party/go-electrum/electrum | sort > /tmp/vend_files.txt
          if ! diff -q /tmp/up_files.txt /tmp/vend_files.txt > /dev/null; then
            echo '::error::File set mismatch between upstream and vendored go-electrum (outside allowed patches):'
            diff /tmp/up_files.txt /tmp/vend_files.txt
            exit 1
          fi
          echo 'byte-identity OK'

      - name: Verify local patches differ from upstream
        run: |
          set -e
          go mod download github.com/keep-network/go-electrum@v0.0.0-20240206170935-6038cb594daa
          upstream="$(go env GOMODCACHE)/github.com/keep-network/go-electrum@v0.0.0-20240206170935-6038cb594daa/electrum"
          # The four patched files MUST differ from upstream.
          for f in network.go transport.go transport_ws.go scripthash.go; do
            if diff -q "$upstream/$f" "third_party/go-electrum/electrum/$f" > /dev/null; then
              echo "::error::Patched file $f is byte-identical to upstream - local patch appears missing"
              exit 1
            fi
          done
          echo 'local patches verified (non-empty diffs)'

      - name: Run vendored go-electrum test suite
        run: |
          cd third_party/go-electrum && go test -race ./...

  electrum-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      # Root ./... does not include tests inside the vendored Go module.
      - name: Test Electrum lifecycle and native transports with the race detector
        run: >-
          go test -race -timeout 3m -count=1
          ./pkg/bitcoin/electrum ./config
          github.com/checksum0/go-electrum/electrum

  # R2: the `go-build-env` Docker image is built once, up front, so the
  # two test shards below can run against it in parallel and
  # `client-build-test-publish` / `client-build-artifacts` consume it as
  # an artifact without rebuilding. Same path-filter gating as before.
  client-build-image:
    needs: client-detect-changes
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole history for the `git describe` command to work.
          fetch-depth: 0

      - name: Resolve versions
        run: |
          echo "version=$(git describe --tags --match "v[0-9]*" HEAD)" >> $GITHUB_ENV
          echo "revision=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Load environment variables
        uses: keep-network/ci/actions/load-env-variables@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          environment: ${{ github.event.inputs.environment }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # R3 - per-branch Docker layer cache, one stable entry per push:
      #   save key   = <os>-buildx-<ref_name>-<deps-hash>-<sha> (immutable,
      #                no restore-keys on save - each sha is a fresh entry)
      #   deps hash  = first 16 hex chars of sha256(Dockerfile, go.mod, go.sum,
      #                third_party/*/go.mod, third_party/*/go.sum)
      #
      # Restore (actions/cache/restore, `if: always()`) runs on every event.
      # Save (actions/cache/save) runs only after a successful `Move cache`,
      # gated to push / workflow_dispatch, so ephemeral PR refs and the
      # nightly run never write to the branch pool, and a build or move
      # failure can never publish a stale/incomplete cache under the
      # immutable sha key - the save step simply does not run.
      - name: Compute buildx deps hash
        id: deps-hash
        run: |
          set -eu
          # Recurse into third_party (btcsuite/btcec is nested two
          # levels deep, go-electrum only one - `find` catches both).
          files="Dockerfile go.mod go.sum"
          if [ -d third_party ]; then
            files="$files $(find third_party \( -name go.mod -o -name go.sum \) | LC_ALL=C sort)"
          fi
          # shellcheck disable=SC2086  # intentional word splitting
          deps="$(sha256sum $files | sha256sum | awk '{print $1}' | cut -c1-16)"
          echo "hash=${deps}" >> "$GITHUB_OUTPUT"

      - name: Restore Docker layer cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ steps.deps-hash.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.event.pull_request.base.ref && github.event.pull_request.base.ref || github.ref_name }}-${{ steps.deps-hash.outputs.hash }}-
            ${{ runner.os }}-buildx-${{ github.event.pull_request.base.ref && github.event.pull_request.base.ref || github.ref_name }}-
            ${{ runner.os }}-buildx-${{ github.sha }}
            ${{ runner.os }}-buildx-

      - name: Ensure cache directory exists
        if: always()
        run: mkdir -p /tmp/.buildx-cache

      - name: Build Docker Build Image
        uses: docker/build-push-action@v5
        with:
          target: build-docker
          tags: go-build-env
          build-args: |
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          load: true # load image to local registry to use it in next steps
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          context: .

      # Since build-push-action doesn't support outputing an image to multiple outputs
      # we need to save it in a separate step. See: https://github.com/moby/buildkit/issues/1555
      # Once multiple outputs are supported we can replace this step with
      # `outputs` property configured in `Build Docker Build Image`:
      #   outputs: |
      #      type=image
      #      type=docker,dest=/tmp/go-build-env-image.tar
      - name: Save Docker Build Image
        run: |
          docker save --output /tmp/go-build-env-image.tar go-build-env

      - name: Upload Docker Build Image
        uses: actions/upload-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp/go-build-env-image.tar

      - # Temp fix - move cache instead of copying (added below step and
        # modified value of `cache-to`).
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        # Without the change some jobs were failing with `no space left on device`.
        # On pull_request / schedule the cache step is restore-only, so the
        # move is a no-op. On push / workflow_dispatch the move stages the
        # freshly-built layers at /tmp/.buildx-cache for the `Save Docker
        # layer cache` step below.
        name: Move cache
        if: success()
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      # Explicit save, placed after a successful `Move cache` rather than
      # relying on the combined actions/cache@v4's implicit end-of-job
      # save: with the combined action the save fires from a post-job
      # hook regardless of whether the build or move failed, which could
      # publish the pre-build (stale/incomplete) restored layers under
      # this run's immutable sha key - a dead entry that can never be
      # corrected once written. actions/cache/save has no restore-keys
      # (it is write-only) and only runs here, in-line, after Move cache
      # has already succeeded.
      - name: Save Docker layer cache
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ steps.deps-hash.outputs.hash }}-${{ github.sha }}

  # R2: 2-way sharded `go test ./...`. Both shards run in parallel on
  # the `go-build-env` image; each executes a deterministic half of the
  # sorted package list and uploads its own coverage profile. The
  # merged 14% coverage gate runs in `client-build-test-publish`
  # (the required-check context), which aggregates both shards.
  client-go-tests:
    needs: [client-detect-changes, client-build-image]
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      # Deterministic 2-way split: `go list ./...` output is sorted
      # (LC_ALL=C) and halved by index - shard 1 takes the first half,
      # shard 2 the second - so the two shards together cover exactly
      # the package set of the previous unsharded `./...` run. Both
      # shards compute the split independently from the same image and
      # checkout, so the split is stable across the two runs.
      - name: Run Go tests (shard ${{ matrix.shard }}/2)
        run: |
          set -euo pipefail
          packages="$(docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            sh -c 'go list ./... | LC_ALL=C sort')"
          total="$(printf '%s\n' "$packages" | grep -c . || true)"
          if [ "$total" -lt 2 ]; then
            echo "::error::Package list too short to shard (${total:-0} packages); refusing to run an incomplete test suite"
            exit 1
          fi
          half=$(( (total + 1) / 2 ))
          if [ "${{ matrix.shard }}" = "1" ]; then
            start=1
            end=$half
          else
            start=$(( half + 1 ))
            end=$total
          fi
          shard_packages="$(printf '%s\n' "$packages" | sed -n "${start},${end}p")"
          echo "::notice::Shard ${{ matrix.shard }}/2: packages ${start}-${end} of ${total}"
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            -e SHARD_PACKAGES="$(echo "$shard_packages" | tr '\n' ' ')" \
            -v "${{ github.workspace }}/coverage:/coverage" \
            go-build-env \
            sh -c 'gotestsum -- -timeout 15m -coverprofile=/coverage/coverage.out $SHARD_PACKAGES'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-shard-${{ matrix.shard }}
          path: coverage/coverage.out
          if-no-files-found: error

  # R2: aggregator behind the required `client-build-test-publish`
  # check context. Fails whenever either test shard fails (via
  # `needs`), or when the merged coverage gate below fails - the 14%
  # total-coverage threshold is unchanged and is applied to the merged
  # profile of both shards, exactly as before.
  client-build-test-publish:
    needs: [client-detect-changes, client-go-tests]
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Download coverage report (shard 1)
        uses: actions/download-artifact@v4
        with:
          name: go-coverage-shard-1
          path: coverage/shard-1

      - name: Download coverage report (shard 2)
        uses: actions/download-artifact@v4
        with:
          name: go-coverage-shard-2
          path: coverage/shard-2

      # Coverage gate: 14% minimum total. Baseline measured at PR #4256
      # (2026-08-19); no automated baseline-update mechanism exists.
      # Merges the two shard profiles into one (the shards' per-package
      # blocks do not overlap, so a set-union over the block records is
      # equivalent to the single unsharded profile) and applies the
      # original 14% gate to the merged total.
      - name: Check coverage gate
        run: |
          set -eu
          for f in coverage/shard-1/coverage.out coverage/shard-2/coverage.out; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty shard coverage profile $f; the coverage gate cannot run"
              exit 1
            fi
          done
          { echo 'mode: set'
            grep -hv '^mode:' coverage/shard-1/coverage.out coverage/shard-2/coverage.out \
              | LC_ALL=C sort -u
          } > coverage/coverage.merged.out
          go tool cover -func coverage/coverage.merged.out > /tmp/cover-func.txt
          TOTAL=$(grep '^total:' /tmp/cover-func.txt | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          PASS=$(awk -v t="$TOTAL" 'BEGIN { print (t+0 >= 14) ? "yes" : "no" }')
          if [ "$PASS" != "yes" ]; then
            echo "::error::Coverage ${TOTAL}% is below the 14% minimum threshold"
            exit 1
          fi

      - name: Upload merged coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage/coverage.merged.out
          if-no-files-found: warn

  # R1: runtime image, client binaries and their archive moved off the
  # PR critical path. This job runs in parallel with
  # `client-integration-test` / `client-bench` and consumes the
  # `go-build-env-image` artifact; the GCR publish and CI-notify steps
  # keep their original `workflow_dispatch`-only gating. A failure here
  # still red-lights the run.
  client-build-artifacts:
    needs: [client-detect-changes, client-build-image]
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole history for the `git describe` command to work.
          fetch-depth: 0

      - name: Resolve versions
        run: |
          echo "version=$(git describe --tags --match "v[0-9]*" HEAD)" >> $GITHUB_ENV
          echo "revision=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Load environment variables
        uses: keep-network/ci/actions/load-env-variables@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          environment: ${{ github.event.inputs.environment }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # R3 consumer of the per-branch Docker layer cache written by
      # `client-build-image`.  This job is the second buildx user in a
      # run and is restore-only - it never writes the branch's primary
      # cache entry.  The same deps-hash step is duplicated here
      # because the two jobs run on separate runners.
      - name: Compute buildx deps hash
        id: deps-hash
        run: |
          set -eu
          # Recurse into third_party (btcsuite/btcec is nested two
          # levels deep, go-electrum only one - `find` catches both).
          files="Dockerfile go.mod go.sum"
          if [ -d third_party ]; then
            files="$files $(find third_party \( -name go.mod -o -name go.sum \) | LC_ALL=C sort)"
          fi
          # shellcheck disable=SC2086  # intentional word splitting
          deps="$(sha256sum $files | sha256sum | awk '{print $1}' | cut -c1-16)"
          echo "hash=${deps}" >> "$GITHUB_OUTPUT"

      - name: Restore Docker layer cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ steps.deps-hash.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.event.pull_request.base.ref && github.event.pull_request.base.ref || github.ref_name }}-${{ steps.deps-hash.outputs.hash }}-
            ${{ runner.os }}-buildx-${{ github.event.pull_request.base.ref && github.event.pull_request.base.ref || github.ref_name }}-
            ${{ runner.os }}-buildx-${{ github.sha }}
            ${{ runner.os }}-buildx-

      - name: Ensure cache directory exists
        if: always()
        run: mkdir -p /tmp/.buildx-cache

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      - name: Build Docker Runtime Image
        if: github.event_name != 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          target: runtime-docker
          labels: |
            version=${{ env.version }}
            revision=${{ env.revision }}
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache
          context: .

      - name: Login to Google Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCR_REGISTRY_URL }}
          username: _json_key
          password: ${{ secrets.KEEP_TEST_GCR_JSON_KEY }}

      - name: Build and publish Docker Runtime Image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        env:
          IMAGE_NAME: "keep-client"
        with:
          target: runtime-docker
          tags: |
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.version }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.environment }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.version }}-${{ github.event.inputs.environment }}
          labels: |
            version=${{ env.version }}
            revision=${{ env.revision }}
          build-args: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          context: .

      - name: Build Client Binaries
        uses: docker/build-push-action@v5
        with:
          target: output-bins
          outputs: type=local,dest=./out/bin/
          build-args: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache
          context: .

      - name: Verify Linux release compatibility
        run: |
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          tar -xzf out/bin/*-linux-amd64.tar.gz -C "$release_dir"
          for image in debian:bullseye-slim ubuntu:20.04; do
            docker run --rm --platform linux/amd64 \
              --mount "type=bind,src=$release_dir,dst=/release,readonly" \
              "$image" sh -ec 'getconf GNU_LIBC_VERSION; /release/keep-client --version'
          done

      - name: Archive Client Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            out/bin/*.tar.gz
            out/bin/*.md5
            out/bin/*.sha256

      - name: Publish Client Binaries
        if: github.event_name == 'workflow_dispatch'
        uses: thesis/gcp-storage-bucket-action@v3.1.0
        with:
          service-key: ${{ secrets.KEEP_TEST_CLIENT_BINARIES_UPLOADER_SERVICE_KEY_JSON_BASE64 }}
          # TODO: Change to keep-prd-210b once mainnet setup is done and we are sure we want to publish mainnet builds automatically.
          project: keep-test-f3e0
          bucket-name: keep-test-client-binaries
          bucket-path: ${{ github.event.inputs.environment }}/${{ env.version }}
          build-folder: out/bin

      - name: Notify CI about completion of the workflow
        if: github.event_name == 'workflow_dispatch'
        uses: keep-network/ci/actions/notify-workflow-completed@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          module: "github.com/keep-network/keep-core/client"
          url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: ${{ github.event.inputs.environment }}
          upstream_builds: ${{ github.event.inputs.upstream_builds }}
          upstream_ref: ${{ github.event.inputs.upstream_ref }}
          version: ${{ env.version }}

  client-scan:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          args: |
            -exclude=G118
            -exclude-dir=pkg/chain/ethereum/beacon/gen
            -exclude-dir=pkg/chain/ethereum/ecdsa/gen
            -exclude-dir=pkg/chain/ethereum/threshold/gen
            -exclude-dir=pkg/chain/ethereum/tbtc/gen
            ./...

  client-format:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: gofmt
        run: |
          if [ $(gofmt -l . | wc -l) -gt 0 ]; then
            gofmt -d -e .
            exit 1
          fi

  client-vet:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - run: go vet

  client-lint:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.0
        with:
          version: "2026.1"
          install-go: false
          checks: "-SA1019"

  client-bench:
    needs: [client-build-test-publish]
    if: |
      github.event_name == 'workflow_dispatch'
        || github.event_name == 'schedule'
        || github.event_name == 'pull_request'
        || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      # PRs and the nightly schedule compare against the target/current
      # branch's own history; workflow_dispatch runs compare against prior
      # workflow_dispatch runs on the selected ref.
      BENCHMARK_BASELINE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
      BENCHMARK_BASELINE_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      # Baseline lookup: the most recent successful `go-bench` artifact from a
      # `BENCHMARK_BASELINE_EVENT` run of client.yml. Branch refs use
      # `BENCHMARK_BASELINE_BRANCH`; manually selected tags use their commit.
      # `search_artifacts: true` is required because the newest matching run is
      # not guaranteed to be the newest run overall, and it may not carry a
      # `go-bench` artifact at all. A genuine absence of any matching artifact
      # is reported (`if_no_artifact_found: warn`) rather than failing the job;
      # any other download/API error surfaces as a normal step failure.
      - name: Download previous benchmark results
        id: download-prev
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          name: go-bench
          path: bench-prev
          workflow: client.yml
          branch: ${{ github.ref_type != 'tag' && env.BENCHMARK_BASELINE_BRANCH || '' }}
          commit: ${{ github.ref_type == 'tag' && github.sha || '' }}
          event: ${{ env.BENCHMARK_BASELINE_EVENT }}
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Report missing benchmark baseline
        if: steps.download-prev.outputs.found_artifact != 'true'
        run: |
          echo "::notice::No go-bench artifact found for a successful ${{ env.BENCHMARK_BASELINE_EVENT }} run of client.yml on ${{ env.BENCHMARK_BASELINE_BRANCH }}; comparison skipped. Pull requests require a successful push run on the target branch; other events require a successful matching ref/event run."

      - name: Run benchmarks
        run: |
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            go test -bench=. -benchmem -count=10 -run='^$' ./pkg/... \
            > bench.txt
          cat bench.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260813145340-fd4a688df892

      # Benchmark regression check: >12% slower than the baseline
      # established by the most recent successful push run on the
      # target/current branch (main/dev pushes seed their own branch's
      # baseline as they land), or, for workflow_dispatch runs, the
      # most recent successful workflow_dispatch run on the selected
      # ref. A pull request's own `go-bench` artifact is never used as
      # a baseline and never seeds its base branch.
      #
      # R5/D4: the comparison is always computed and posted; only the
      # gate is event-dependent (below).
      - name: Compare benchmarks
        id: compare
        if: steps.download-prev.outputs.found_artifact == 'true' && hashFiles('bench-prev/**') != ''
        run: |
          python3 - <<'EOF'
          import glob, re

          def parse(path):
              keys = set()
              pkg = None
              with open(path) as f:
                  for line in f:
                      line = line.rstrip("\n")
                      if line.startswith("pkg: "):
                          pkg = line[len("pkg: "):].strip()
                          continue
                      if not line.startswith("Benchmark"):
                          continue
                      tokens = line.split()
                      if len(tokens) < 4:
                          continue
                      name = re.sub(r'-\d+$', '', tokens[0])  # strip Go's trailing GOMAXPROCS suffix
                      values = tokens[2:]
                      for i in range(0, len(values) - 1, 2):
                          keys.add((pkg, name, values[i + 1]))
              return keys

          prev_keys = set()
          for path in glob.glob('bench-prev/*.txt'):
              prev_keys |= parse(path)
          curr_keys = parse('bench.txt')

          new_keys = sorted(curr_keys - prev_keys, key=lambda k: (k[0] or '', k[1], k[2]))
          if new_keys:
              print(f"::notice::{len(new_keys)} benchmark metric(s) have no baseline yet and are excluded from the regression check:")
              for pkg, name, unit in new_keys:
                  print(f"::notice::  {pkg or 'unknown package'}: {name} ({unit})")
          EOF

          benchstat bench-prev/*.txt bench.txt | tee benchstat-results.txt

      # D4: hard regression gate, enforced on pushes to the
      # development trunk (`dev`) and on the nightly schedule (which
      # runs the full suite on `main`), plus manual dispatch runs.
      # A regression can only reach `main` after passing the `dev`
      # gate, so pushes to `main` are not re-gated.
      - name: Fail on benchmark regression
        if: |
          !cancelled()
          && steps.compare.outcome == 'success'
          && (github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch'
            || (github.event_name == 'push' && github.ref_name == 'dev'))
        run: |
          python3 - <<'EOF'
          import sys, re
          content = open('benchstat-results.txt').read()
          regressions = []
          for line in content.splitlines():
              if '~' in line or not line.strip():
                  continue
              m = re.search(r'\+(\d+\.\d+)%', line)
              if m and float(m.group(1)) > 12:
                  regressions.append(line)
          if regressions:
              print('Performance regressions >12% detected:')
              for r in regressions:
                  print(' ', r)
              sys.exit(1)
          print('No benchmark regressions >12% against baseline.')
          EOF

      # D4: on pull requests the same regression is advisory - reported
      # in the job log, the job summary, and the PR comment, but the
      # check reports success so a PR is never blocked by it.
      - name: Report benchmark regression (advisory on pull_request)
        if: |
          !cancelled()
          && github.event_name == 'pull_request'
          && steps.compare.outcome == 'success'
        run: |
          python3 - <<'EOF'
          import os
          import re
          content = open('benchstat-results.txt').read()
          regressions = []
          for line in content.splitlines():
              if '~' in line or not line.strip():
                  continue
              m = re.search(r'\+(\d+\.\d+)%', line)
              if m and float(m.group(1)) > 12:
                  regressions.append(line)
          if regressions:
              print('::warning::Performance regressions >12% detected (advisory on pull requests):')
              for r in regressions:
                  print(f'::warning::  {r}')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('## Benchmark regression (advisory)\n\n')
                  f.write('The following benchmarks regressed >12% against the baseline. '
                          'On pull requests this is advisory; the regression is a hard '
                          'failure on the push to dev that lands it and on the nightly '
                          'schedule run.\n\n')
                  for r in regressions:
                      f.write(f'- `{r}`\n')
          else:
              print('No benchmark regressions >12% against baseline.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('## Benchmark check\n\nNo regressions >12% against the baseline.\n')
          EOF

      # Publish the same comparison that already gates the job into the PR
      # conversation so reviewers see it without leaving the PR. The body is
      # identified by an HTML marker; re-runs update the same comment instead
      # of stacking one per push. `continue-on-error` defends against an org
      # policy that strips comment-write permissions from GITHUB_TOKEN — the
      # diff in the job log and the go-bench artifact remain authoritative.
      - name: Post benchmark results to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          HAS_BASELINE: ${{ steps.download-prev.outputs.found_artifact == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- client-bench -->';
            const header = '### `client-bench` results';
            const baselineNote = process.env.HAS_BASELINE === 'true'
              ? 'Baseline: latest successful push on the target branch. Regressions >12% are advisory on pull requests (hard-fail on push to dev and on the nightly schedule).'
              : 'No baseline yet — the next push on the target branch will seed it.';
            let benchSection;
            try {
              const benchstat = fs.readFileSync('benchstat-results.txt', 'utf-8').trim();
              benchSection = `\n\n<details><summary>benchstat vs baseline</summary>\n\n\`\`\`\n${benchstat}\n\`\`\`\n</details>\n`;
            } catch (err) {
              benchSection = '';
            }
            const body = `${marker}\n${header}\n\n${baselineNote}${benchSection}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-bench
          path: bench.txt
          overwrite: true
          if-no-files-found: warn

  client-integration-test:
    needs: [client-detect-changes, electrum-integration-detect-changes, client-build-test-publish]
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        id: load-image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      - name: Run Go Integration Tests
        env:
          ETHEREUM_MAINNET_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
        run: |
          docker run \
            -e ETHEREUM_MAINNET_RPC_URL \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            sh -ec 'packages=$(go list ./...);
              packages=$(printf "%s\n" "$packages" | grep -v "/pkg/bitcoin/electrum$");
              gotestsum -- -timeout 20m -tags=integration $packages'

      # Public Electrum servers can time out independently of this PR. Run
      # their tests separately so they cannot mask other integration failures.
      # They remain required for Bitcoin client/config/dependency changes and
      # for every push, scheduled run, and manual run.
      - name: Run public Electrum integration tests
        if: ${{ !cancelled() && steps.load-image.outcome == 'success' }}
        continue-on-error: ${{ github.event_name == 'pull_request' && needs.electrum-integration-detect-changes.outputs.path-filter == 'false' }}
        run: |
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            gotestsum -- -timeout 20m -tags=integration ./pkg/bitcoin/electrum

  # R8 aggregator gate: closes the fail-open edge of the dorny/paths-filter
  # stub pattern - a `dorny/paths-filter` crash in `client-detect-changes`
  # would otherwise propagate as a Success on every downstream required
  # context (skipped jobs report Success), letting a PR reach main with the
  # client checks never run. This job runs on every outcome and FAILS
  # unless `client-detect-changes` succeeded AND each gated job
  # succeeded, or was skipped only because the path filter was 'false' on
  # a pull request; on non-PR events every gated job must have succeeded.
  # The required-check context swap (client-build-test-publish ->
  # client-gate) is time-gated by decision D2 and lands in a follow-up on
  # protected main; the original required contexts stay in place.
  client-gate:
    if: always()
    needs:
      - client-detect-changes
      - client-build-test-publish
      - client-scan
      - client-format
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate client gate
        env:
          EVENT: ${{ github.event_name }}
          PATH_FILTER: ${{ needs.client-detect-changes.outputs.path-filter }}
          DETECT: ${{ needs.client-detect-changes.result }}
          BTP: ${{ needs.client-build-test-publish.result }}
          SCAN: ${{ needs.client-scan.result }}
          FORMAT: ${{ needs.client-format.result }}
        run: |
          # Skipped jobs report Success for required-check purposes, so
          # this aggregator is the only place where a skip can be told
          # apart from a genuine success.
          normalize() {
            case "$1" in
              success) echo success ;;
              skipped) echo skipped ;;
              *) echo failed ;;
            esac
          }
          detect="$(normalize "$DETECT")"
          btp="$(normalize "$BTP")"
          scan="$(normalize "$SCAN")"
          format="$(normalize "$FORMAT")"

          # A `client-detect-changes` crash (dorny/paths-filter error)
          # propagates as skipped success on every downstream required
          # context; that is the fail-open edge this gate closes.
          # detect-changes must succeed on every event.
          if [ "$detect" != success ]; then
            echo "::error::client-gate: client-detect-changes did not succeed ($DETECT); required client checks cannot be trusted"
            exit 1
          fi

          # Was this gated job expected to run on this event? Derived
          # directly from each job`s own `if:` condition:
          #   client-build-test-publish: event != pull_request || filter == true
          #   client-scan, client-format:   event == push             || filter == true
          # A job that was expected to run must be `success`. A job that
          # was not expected to run is fine as `skipped` (its own `if:`
          # was false) or `success` (it ran anyway - never an error).
          expected_run() {
            case "$1" in
              client-build-test-publish)
                # event != pull_request || filter == true
                [ "$EVENT" != "pull_request" ] || [ "$PATH_FILTER" = "true" ]
                ;;
              client-scan|client-format)
                # event == push || filter == true
                [ "$EVENT" = "push" ] || [ "$PATH_FILTER" = "true" ]
                ;;
              *)
                return 1
                ;;
            esac
          }

          for pair in "client-build-test-publish:$BTP" \
                     "client-scan:$SCAN" \
                     "client-format:$FORMAT"; do
            name="${pair%%:*}"
            state="$(normalize "${pair#*:}")"
            if [ "$state" = failed ]; then
              echo "::error::client-gate: $name did not succeed (${pair#*:})"
              exit 1
            fi
            if expected_run "$name"; then
              if [ "$state" != success ]; then
                echo "::error::client-gate: $name was expected to run on event=$EVENT but was $state (path-filter=$PATH_FILTER)"
                exit 1
              fi
            fi
            # Not expected to run and state is `skipped` or `success`: fine.
          done
          echo "client-gate: all required client checks succeeded (build-test-publish=${btp}, scan=${scan}, format=${format})"
