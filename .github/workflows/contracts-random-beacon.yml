name: Solidity Random Beacon

on:
  pull_request:
    branches:
      - main
      - dev
  # We intend to use `workflow dispatch` in two different situations/paths:
  # 1. If a workflow will be manually dispatched from branch named
  #    `dapp-development`, workflow will deploy the contracts on the selected
  #    testnet and publish them to NPM registry with `dapp-dev-<environment>`
  #    suffix and `dapp-development-<environment>` tag. Such packages are meant
  #    to be used locally by the team developing Threshold Token dApp and may
  #    contain contracts that have different values from the ones used on
  #    mainnet.
  # 2. If a workflow will be manually dispatched from a branch which name is not
  #    `dapp-development`, the workflow will deploy the contracts on the
  #    selected testnet and publish them to NPM registry with `<environment>`
  #    suffix and tag. Such packages will be used later to deploy public
  #    Threshold Token dApp on a testnet, with contracts resembling those used
  #    on mainnet.
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (network) for workflow execution, e.g. `sepolia`"
        required: true
      upstream_builds:
        description: "Upstream builds"
        required: false
      upstream_ref:
        description: "Git reference to checkout (e.g. branch name)"
        required: false
        default: "main"

jobs:
  contracts-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
      bundled-beacon-export-filter: ${{ steps.filter.outputs.bundled-beacon-export-filter }}
    steps:
      - uses: actions/checkout@v3
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './solidity/random-beacon/**'
              - './.github/workflows/contracts-random-beacon.yml'
              - './.github/actions/install-yarn-deps/**'
              - './.github/actions/docker-build-push/**'
            bundled-beacon-export-filter:
              - './solidity/random-beacon/deploy/**'
              - './solidity/random-beacon/tasks/**'
              - './solidity/random-beacon/utils/**'
              - './solidity/ecdsa/external/random-beacon-export/**'
              - './.github/workflows/contracts-random-beacon.yml'

  contracts-lint:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"
      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon
      - name: Build
        run: yarn build
      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

  contracts-slither:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"
      - uses: actions/setup-python@v4
        with:
          python-version: 3.10.8
      - name: Install Solidity
        env:
          SOLC_VERSION: 0.8.9 # according to solidity.version in hardhat.config.js
        run: |
          pip3 install solc-select
          solc-select install $SOLC_VERSION
          solc-select use $SOLC_VERSION
      - name: Install Slither
        env:
          SLITHER_VERSION: 0.8.3
        run: pip3 install slither-analyzer==$SLITHER_VERSION
      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon
      - name: Run Slither
        run: slither .

  contracts-build-and-test:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon

      - name: Build solidity contracts
        run: yarn build

      - name: Run tests
        if: github.ref != 'refs/heads/dapp-development'
        run: yarn test

  contracts-deployment-dry-run:
    needs: contracts-detect-changes
    if: |
      needs.contracts-detect-changes.outputs.path-filter == 'true'
        || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon

      - name: Deploy contracts
        run: yarn deploy:test

      - name: Build Docker Image
        uses: ./.github/actions/docker-build-push
        with:
          imageName: keep-random-beacon-hardhat
          context: ./solidity/random-beacon
          push: false
          load: true

      - name: Verify non-root runtime user
        run: |
          docker run --rm --entrypoint sh "$IMAGE_NAME" -c 'test "$(id -u)" = 1000 && test "$(id -g)" = 1000'
          docker run --rm --entrypoint sh "$IMAGE_NAME" -c 'test -w "$WORK_DIR"'
          docker run --rm "$IMAGE_NAME" --help >/dev/null

  # Enforces the core safety constraint stated in issue #4216 for the
  # hardhat-deploy v1 upgrade: `export/` and `export.json` (the deploy
  # artifacts consumed downstream by @keep-network/tbtc-v2) must stay
  # byte-identical across hardhat-deploy versions and future changes.
  # Both paths are gitignored (no committed baseline to diff against in
  # git), so this job regenerates them on every gated run and compares
  # a checksum manifest against the committed baseline file. A mismatch
  # means the deploy/export artifact shape changed; if intentional,
  # regenerate solidity/random-beacon/export-baseline.sha256 with the
  # same commands below and commit it alongside the change.
  #
  # Note: the manifest covers the full export/ tree, including artifacts
  # of external dependencies deployed onto the local test network
  # (@keep-network/sortition-pools, @openzeppelin/*, @thesis/*,
  # @threshold-network/*). This is safe from upstream-publish flakiness:
  # install-yarn-deps runs `yarn install --immutable` against the
  # committed yarn.lock, which pins each of these to a concrete resolved
  # version (e.g. `@keep-network/sortition-pools@npm:^2.0.0-pre.16`
  # resolves to a fixed `2.0.0-pre.16` in yarn.lock, not whatever the
  # range currently resolves to upstream) - external artifacts only
  # change when yarn.lock itself changes. So a diff under
  # export/artifacts/@* means a dependency version bump landed in this
  # PR/branch; regenerate the baseline as part of that same change, the
  # same way as any other intentional export-shape change described
  # above.
  contracts-export-byte-identity:
    needs: contracts-detect-changes
    if: github.event_name != 'pull_request' || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon

      - name: Deploy and export contracts
        run: yarn deploy:test --network hardhat --export export.json

      - name: Generate packed export artifacts
        run: yarn prepack

      - name: Verify export byte-identity against baseline
        run: |
          set -e
          sha256sum export.json > /tmp/manifest.txt
          find export -type f | sort | xargs sha256sum >> /tmp/manifest.txt
          if ! diff -q export-baseline.sha256 /tmp/manifest.txt > /dev/null; then
            echo '::error::export.json/export/ artifact byte-identity mismatch against solidity/random-beacon/export-baseline.sha256.'
            echo '::error::If this change is intentional, regenerate the baseline locally (see the job comment above) and commit it alongside this change.'
            diff export-baseline.sha256 /tmp/manifest.txt
            exit 1
          fi
          echo 'export byte-identity OK'

  # ECDSA bundles the compiled Beacon deployment scripts, tasks and utilities
  # under solidity/ecdsa/external/random-beacon-export/ so it can deploy
  # against a v6 Beacon while the published Beacon package is still ethers v5.
  # That bundle is generated from this package's TypeScript sources, so any
  # change under deploy/, tasks/ or utils/ silently makes it stale - until now
  # only the manual
  # solidity/scripts/ethers-v6-compatibility/pack-and-capture.cjs script
  # checked it, and that script never runs in CI. This job regenerates the
  # exports and byte-compares them against the committed bundle, so drift
  # fails here instead of shipping.
  bundled-beacon-export-freshness:
    needs: contracts-detect-changes
    if: github.event_name != 'pull_request' || needs.contracts-detect-changes.outputs.bundled-beacon-export-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon

      - name: Build solidity contracts
        run: yarn build

      - name: Generate packed export artifacts
        run: yarn prepack

      - name: Verify bundled Beacon export is up to date
        run: |
          set -e
          bundle=../ecdsa/external/random-beacon-export
          staging="$(mktemp -d)"
          mkdir -p "$staging/deploy" "$staging/utils" "$staging/tasks/utils"
          cp export/deploy/*.js "$staging/deploy/"
          cp export/utils/wait-for-confirmations.js "$staging/utils/"
          cp export/tasks/initialize.js export/tasks/unlock-eth-accounts.js "$staging/tasks/"
          cp export/tasks/utils/*.js "$staging/tasks/utils/"
          if ! diff -r --exclude=README.md "$staging" "$bundle"; then
            echo '::error::solidity/ecdsa/external/random-beacon-export/ is stale - it no longer matches solidity/random-beacon/export/.'
            echo '::error::Regenerate it with the commands documented in solidity/ecdsa/external/random-beacon-export/README.md and commit the result alongside this change.'
            exit 1
          fi
          echo 'bundled Beacon export freshness OK'

  contracts-deployment-testnet:
    needs: [contracts-build-and-test]
    # The ethers v6 deployment exports break existing ethers v5 consumers.
    # Block workflow_dispatch publication to the `<environment>` tag; this
    # gate replaces the original dispatch condition, kept here so it can be
    # restored:
    #   github.event_name == 'workflow_dispatch'
    #     && github.ref != 'refs/heads/dapp-development'
    # Re-enable only after the consumer migration and release pins are ready;
    # see solidity/docs/ethers-v6-compatibility.md#limits-and-release-gates.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"
          registry-url: "https://registry.npmjs.org"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon

      - name: Get upstream packages versions
        uses: keep-network/ci/actions/upstream-builds-query@v2
        id: upstream-builds-query
        with:
          upstream-builds: ${{ github.event.inputs.upstream_builds }}
          query: |
            threshold-contracts-version = github.com/threshold-network/solidity-contracts#version

      - name: Resolve latest contracts
        run: |
          yarn up \
            @threshold-network/solidity-contracts@${{ steps.upstream-builds-query.outputs.threshold-contracts-version }} \
            @keep-network/sortition-pools

      # TODO: Remove this step. We replace sortition pools for deployment on testnet
      # with forked contracts that were tweaked to make operators joining the pool
      # easier. This should never be used outside of the test environment. On
      # test environment it should be used temporarily only.
      - name: Use Sortition Pool forked contracts
        run: |
          yarn up @keep-network/sortition-pools@github:keep-network/sortition-pools#test-fork

      - name: Configure tenderly
        env:
          TENDERLY_TOKEN: ${{ secrets.TENDERLY_TOKEN }}
        run: ./config_tenderly.sh

      - name: Deploy contracts
        env:
          CHAIN_API_URL: ${{ secrets.SEPOLIA_ETH_HOSTNAME_HTTP }}
          ACCOUNTS_PRIVATE_KEYS: ${{ secrets.TESTNET_ETH_CONTRACT_OWNER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: yarn deploy --network ${{ github.event.inputs.environment }}

      - name: Bump up package version
        id: npm-version-bump
        uses: keep-network/npm-version-bump@v2
        with:
          work-dir: solidity/random-beacon
          environment: ${{ github.event.inputs.environment }}
          branch: ${{ github.ref }}
          commit: ${{ github.sha }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag ${{ github.event.inputs.environment }} --network=${{ github.event.inputs.environment }}

      - name: Build and Publish Docker image
        uses: ./.github/actions/docker-build-push
        with:
          environment: ${{ github.event.inputs.environment }}
          imageName: keep-random-beacon-hardhat
          context: ./solidity/random-beacon
          push: true
          gcrJsonKey: ${{ secrets.KEEP_TEST_GCR_JSON_KEY }}

      - name: Notify CI about completion of the workflow
        uses: keep-network/ci/actions/notify-workflow-completed@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          module: "github.com/keep-network/keep-core/random-beacon"
          url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: ${{ github.event.inputs.environment }}
          upstream_builds: ${{ github.event.inputs.upstream_builds }}
          upstream_ref: ${{ github.event.inputs.upstream_ref }}
          version: ${{ steps.npm-version-bump.outputs.version }}

  # This job is responsible for publishing packackes with slightly modified
  # contracts. The modifications are there to help with the process of testing
  # some features on the T Token Dashboard. The job starts only if workflow
  # gets triggered by the `workflow_dispatch` event on the branch called
  # `dapp-development`.
  contracts-dapp-development-deployment-testnet:
    needs: [contracts-build-and-test]
    # The ethers v6 deployment exports break existing ethers v5 consumers.
    # Block workflow_dispatch publication to the
    # `dapp-development-<environment>` tag; this gate replaces the original
    # dispatch condition, kept here so it can be restored:
    #   github.event_name == 'workflow_dispatch'
    #     && github.ref == 'refs/heads/dapp-development'
    # Re-enable only after the consumer migration and release pins are ready;
    # see solidity/docs/ethers-v6-compatibility.md#limits-and-release-gates.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solidity/random-beacon
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          # Pinned to match the Dockerfiles exactly so CI and the image cannot
          # drift apart. Node 24 requires hardhat >= 2.26 - below it, the solc
          # download fails with HH502 (see PR description for details).
          node-version: "24.11.1"
          registry-url: "https://registry.npmjs.org"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/random-beacon

      - name: Get upstream packages versions
        uses: keep-network/ci/actions/upstream-builds-query@v2
        id: upstream-builds-query
        with:
          upstream-builds: ${{ github.event.inputs.upstream_builds }}
          query: |
            threshold-contracts-version = github.com/threshold-network/solidity-contracts#version

      - name: Resolve latest contracts
        run: |
          yarn up \
            @threshold-network/solidity-contracts@${{ steps.upstream-builds-query.outputs.threshold-contracts-version }} \
            @keep-network/sortition-pools
      
      - name: Deploy contracts
        env:
          CHAIN_API_URL: ${{ secrets.SEPOLIA_ETH_HOSTNAME_HTTP }}
          ACCOUNTS_PRIVATE_KEYS: ${{ secrets.DAPP_DEV_TESTNET_ETH_CONTRACT_OWNER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: yarn deploy --network ${{ github.event.inputs.environment }}

      - name: Bump up package version
        id: npm-version-bump
        uses: keep-network/npm-version-bump@v2
        with:
          work-dir: solidity/random-beacon
          environment: dapp-dev-${{ github.event.inputs.environment }}
          branch: ${{ github.ref }}
          commit: ${{ github.sha }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag dapp-development-${{ github.event.inputs.environment }} --network=${{ github.event.inputs.environment }}

      - name: Build and Publish Docker image
        uses: ./.github/actions/docker-build-push
        with:
          environment: ${{ github.event.inputs.environment }}
          imageName: keep-random-beacon-hardhat-dapp-dev
          context: ./solidity/random-beacon
          push: true
          gcrJsonKey: ${{ secrets.KEEP_TEST_GCR_JSON_KEY }}

      - name: Notify CI about completion of the workflow
        uses: keep-network/ci/actions/notify-workflow-completed@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          module: "github.com/keep-network/keep-core/random-beacon"
          url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: ${{ github.event.inputs.environment }}
          upstream_builds: ${{ github.event.inputs.upstream_builds }}
          upstream_ref: dapp-development
          version: ${{ steps.npm-version-bump.outputs.version }}
